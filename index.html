<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA 應用清單</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #f8fafc; color: #0f172a; }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } a.app { background: #1e293b; border-color: #334155; } a.app small { color: #94a3b8; } }
    main { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 20px; margin: 0 0 20px; }
    a.app { display: block; padding: 16px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; color: inherit; text-decoration: none; }
    a.app b { display: block; font-size: 16px; margin-bottom: 4px; }
    a.app small { color: #64748b; }
  </style>
</head>
<body>
  <main>
    <h1>PWA 應用清單</h1>
    <a class="app" href="stock/">
      <b>台灣股票監控</b>
      <small>監控清單、停利停損警示、歷史股價走勢</small>
    </a>
    <a class="app" href="route/">
      <b>路線規劃</b>
      <small>匯入含經緯度的清單，依直線距離排出最短行進順序</small>
    </a>
    <a class="app" href="drama/">
      <b>追劇記錄</b>
      <small>記錄追到哪一季哪一集、哪季完結，可依演員搜尋</small>
    </a>
    <a class="app" href="elements/">
      <b>元素週期表</b>
      <small>繁體中文版互動式元素週期表，含實物圖與玻爾模型</small>
    </a>
  </main>
</body>
</html>
