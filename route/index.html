<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1d2330; --muted:#6b7280; --border:#dfe3e9;
  --accent:#2563eb; --accent-text:#ffffff; --accent-soft:#e8efff;
  --warn-bg:#fff6e5; --warn:#9a5a00; --err-bg:#fdecec; --err:#c62828;
  --start:#1e3a8a; --idle:#9aa3b2; --todo:#d93025; --done:#2e8b57; --done-soft:#e6f4ec;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111419; --card:#1a1e26; --text:#e6e8ec; --muted:#9aa3b2; --border:#2c323d;
    --accent:#5b93ff; --accent-text:#ffffff; --accent-soft:#1f2a44;
    --warn-bg:#352812; --warn:#f0b75a; --err-bg:#3a1c1c; --err:#ff8a8a;
    --start:#4263eb; --idle:#6b7383; --todo:#ff6b63; --done:#4cc38a; --done-soft:#1b2e24;
  }
}
:root[data-theme="dark"]{
  --bg:#111419; --card:#1a1e26; --text:#e6e8ec; --muted:#9aa3b2; --border:#2c323d;
  --accent:#5b93ff; --accent-text:#ffffff; --accent-soft:#1f2a44;
  --warn-bg:#352812; --warn:#f0b75a; --err-bg:#3a1c1c; --err:#ff8a8a;
  --start:#4263eb; --idle:#6b7383; --todo:#ff6b63; --done:#4cc38a; --done-soft:#1b2e24;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
header{padding:14px 16px 6px;max-width:1280px;margin:0 auto}
header h1{font-size:20px;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}

.layout{display:grid;gap:12px;padding:8px 16px 32px;max-width:1280px;margin:0 auto;
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"import" "start" "plan" "list" "map" "result";}
.a-import{grid-area:import}.a-start{grid-area:start}.a-list{grid-area:list}
.a-plan{grid-area:plan}.right{display:contents}.a-map{grid-area:map}.a-result{grid-area:result}
@media (min-width:900px){
  /* 電腦版：左邊是操作步驟，右邊上面是地圖、下面是路線順序，整欄固定在畫面內 */
  .layout{grid-template-columns:minmax(360px,440px) minmax(0,1fr);
    grid-template-areas:"import right" "start right" "plan right" "list right";
    grid-template-rows:auto auto auto 1fr;}
  .right{display:flex;flex-direction:column;gap:12px;grid-area:right;position:sticky;top:12px;align-self:start;height:calc(100vh - 24px)}
  .a-map{grid-area:auto;flex:1 1 auto;min-height:260px}
  #map{height:100%!important}
  .a-result{grid-area:auto;flex:0 1 auto;max-height:45%;overflow:auto}
  .route{max-height:none;overflow:visible}
}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;min-width:0}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.step{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-text);font-size:12px;align-items:center;justify-content:center;flex:none}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}

button,.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.block{width:100%;min-height:46px;font-size:16px;font-weight:600}
input[type=text],input[type=search],select{min-height:40px;width:100%;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:16px;min-width:0}
input[type=file]{width:100%;font:inherit;color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1 1 160px}

.notice{border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.err{background:var(--err-bg);color:var(--err)}
.notice.ok{background:var(--accent-soft);color:var(--accent)}
.notice:empty{display:none}

.start-now{margin-top:10px;font-size:14px}
.start-now b{color:var(--start)}

[hidden]{display:none!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--text)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-popup-content{margin:12px 14px}
.pop{min-width:170px}
.pop .pn{font-weight:700;font-size:15px;word-break:break-all}
.pop .pm{color:var(--muted);font-size:12.5px;word-break:break-all;margin-top:2px}
.pop .doneat{margin-top:2px}
.pop .pb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pop .pb button{min-height:36px;padding:0 10px;font-size:14px}
@keyframes flash{0%,55%{box-shadow:inset 0 0 0 3px var(--accent)}100%{box-shadow:inset 0 0 0 3px transparent}}
.item.flash{animation:flash 1.8s ease-out}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1}
.seg button + button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent);color:var(--accent-text)}

.count{margin-left:auto;color:var(--muted);font-size:13px}
.list{margin-top:10px;max-height:50vh;overflow:auto;border:1px solid var(--border);border-radius:8px;-webkit-overflow-scrolling:touch}
.list:empty::before{content:"尚未匯入資料";display:block;padding:16px;color:var(--muted);text-align:center}
.item{display:flex;gap:10px;align-items:stretch;padding:0;border-bottom:1px solid var(--border);border-left:4px solid transparent;user-select:none}
.item.todo{border-left-color:var(--todo)}
.item.done{border-left-color:var(--done)}
.item:last-child{border-bottom:0}
.item .pick{display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0;padding:10px 0 10px 12px;cursor:pointer}
.item.checked{background:var(--accent-soft)}
.item.invalid .pick{opacity:.55;cursor:not-allowed}
.item.done{background:var(--done-soft)}
.item.done .pick{opacity:.65;cursor:default}
.item.done .name{text-decoration:line-through}
.item input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.donebox{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:64px;border-left:1px solid var(--border);font-size:12px;color:var(--muted);cursor:pointer}
.donebox input{margin:0;accent-color:var(--done)}
.donebox.off{opacity:.4;cursor:not-allowed}
.item .doneat{color:var(--done);font-size:12.5px}
.tools{margin-top:8px}
.tools label{display:inline-flex;align-items:center;gap:6px;min-height:40px;cursor:pointer}
.tools input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
button.warnbtn{border-color:var(--err);color:var(--err)}
.item .body{min-width:0;flex:1}
.item .name{font-weight:600;word-break:break-all}
.item .meta{color:var(--muted);font-size:12.5px;word-break:break-all}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-left:6px;vertical-align:1px;font-weight:500}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)}

#map{height:55vh;min-height:320px;border-radius:12px;border:1px solid var(--border);z-index:0}
.map-tools{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:6px}
.map-tools button{min-height:34px;padding:0 10px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.a-map{position:relative}
.picking #map{cursor:crosshair}
.pick-banner{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:500;background:var(--start);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;display:none;white-space:nowrap}
.picking .pick-banner{display:block}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.summary div{background:var(--accent-soft);border-radius:8px;padding:8px;text-align:center}
.summary b{display:block;font-size:18px;color:var(--accent)}
.summary span{font-size:12px;color:var(--muted)}
.route{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--border);border-radius:8px;max-height:60vh;overflow:auto}
.route li{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);align-items:flex-start}
.route li:last-child{border-bottom:0}
.route .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.route .no.s{background:var(--start)}
.route .body{flex:1;min-width:0}
.route .dist{flex:none;text-align:right;font-size:12.5px;color:var(--muted);line-height:1.35}
.route .dist b{color:var(--text);font-size:13.5px}
.links{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.links a{justify-content:flex-start;white-space:normal;padding:8px 12px}

.num-icon span,.start-icon span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;box-sizing:border-box;white-space:nowrap;color:#fff;border:2px solid #fff;align-items:center;justify-content:center}
.num-icon span{min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--accent);font:700 12px/1 system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.start-icon span{min-width:30px;height:30px;padding:0 7px;border-radius:15px;background:var(--start);font:700 13px/1 system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pop-list{max-height:260px;overflow:auto}
.pop-list .pop + .pop{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <h1>路線規劃</h1>
  <p>匯入地點資料，勾選要經過的地點，依直線距離算出最短順序</p>
</header>

<main class="layout">
  <section class="card a-import">
    <h2><span class="step">1</span>匯入地點資料</h2>
    <input type="file" id="file" accept=".csv,.xlsx,.xls">
    <p class="hint">支援 CSV、Excel。欄位依序為：地點、代號、經度、緯度、地址、完成時間（後兩欄可省略），表頭文字不限。有完成時間的列會標示為已完成。經緯度填反會自動對調。</p>
    <div class="notice" id="importMsg"></div>
  </section>

  <section class="card a-start">
    <h2><span class="step">2</span>設定起始位置</h2>
    <div class="row">
      <input type="text" class="grow" id="startInput" placeholder="緯度, 經度（可直接貼上）" inputmode="decimal">
      <button id="startApply">套用</button>
    </div>
    <div class="row" style="margin-top:8px">
      <select class="grow" id="startPoint"><option value="">或選擇某個地點作為起點…</option></select>
      <button id="startPick">在地圖點選</button>
    </div>
    <div class="start-now" id="startNow">起點：<span style="color:var(--muted)">尚未設定</span></div>
  </section>

  <section class="card a-plan">
    <h2><span class="step">3</span>規劃路徑</h2>
    <div class="seg" id="selSeg" style="margin-bottom:10px">
      <button data-sel="auto">自動：最近 N 個</button>
      <button data-sel="manual">手動：我的勾選</button>
    </div>
    <div class="row" id="nRow" style="margin-bottom:10px">
      <label for="nearN" style="white-space:nowrap">N（個）</label>
      <input type="number" id="nearN" class="grow" min="1" step="1" inputmode="numeric" value="4" style="max-width:100px;min-height:40px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:16px">
      <button id="pickNearBtn">只選取不規劃</button>
    </div>
    <div class="seg" id="methodSeg" style="margin-bottom:10px">
      <button data-method="chain">連鎖最近</button>
      <button data-method="start">離起點最近</button>
    </div>
    <div class="seg" id="modeSeg">
      <button data-mode="round">環狀（回到起點）</button>
      <button data-mode="open">單程（不回起點）</button>
    </div>
    <button class="primary block" id="planBtn" style="margin-top:10px">規劃最佳路徑</button>
    <div class="notice" id="planMsg"></div>
  </section>

  <section class="card a-list">
    <h2><span class="step">4</span>勾選地點</h2>
    <input type="search" id="search" placeholder="搜尋地點、代號、地址">
    <div class="row" style="margin-top:8px">
      <button id="selAll">全選</button>
      <button id="selNone">全取消</button>
      <span class="count" id="count">已勾選 0 個</span>
    </div>
    <div class="row tools">
      <label for="hideDone"><input type="checkbox" id="hideDone">隱藏已完成</label>
      <button id="exportList">匯出清單</button>
      <button id="clearDone" class="grow">清除完成記錄</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <div class="right">
  <section class="a-map">
    <div id="map"></div>
    <div class="map-tools"><button id="fitBtn">全部顯示</button></div>
    <div class="pick-banner">點地圖任一處設為起點</div>
  </section>

  <section class="card a-result" id="result" hidden>
    <h2>路線順序</h2>
    <div class="summary" id="summary"></div>
    <div class="row">
      <button id="exportBtn">匯出 CSV</button>
    </div>
    <div class="links" id="links"></div>
    <ol class="route" id="route"></ol>
  </section>
  </div>
</main>

<script src="vendor/leaflet.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script>
(() => {
'use strict';

const LS_KEY = 'route_plan_v1';
const EXACT_LIMIT = 13;          // 點數 ≤ 此值用 Held-Karp 精確解
const GMAPS_POINTS = 10;          // Google Maps 每段連結最多點數（起點＋8 中途點＋終點）

let points = [];   // {id,name,code,lat,lng,addr,checked,swapped,invalid,done,doneAt}
let hideDone = false;
let start = null;    // {lat,lng,label,pointId}
let mode = 'open';      // 預設單程
let selMode = 'auto';   // auto：規劃時自動選離起點最近的 N 個；manual：用使用者勾選的
let nearN = 4;
let nearMethod = 'chain';  // chain：連鎖最近（從上一個選到的點找最近的）；start：離起點最近
let lastRoute = null;
let picking = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtKm = m => (m / 1000).toFixed(m < 10000 ? 2 : 1);

// ---------- 儲存 ----------
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ points, start, mode, hideDone, selMode, nearN, nearMethod })); } catch (e) {}
}
// 回傳還原狀態（讀到的字元數、錯誤訊息），開啟頁面時顯示在匯入區，方便判斷儲存有沒有生效
function load() {
  let len = 0;
  try {
    const raw = localStorage.getItem(LS_KEY);
    len = raw ? raw.length : 0;
    const d = JSON.parse(raw || 'null');
    if (!d) return { len };
    points = Array.isArray(d.points) ? d.points : [];
    start = d.start || null;
    mode = d.mode === 'open' ? 'open' : 'round';
    hideDone = !!d.hideDone;
    selMode = d.selMode === 'manual' ? 'manual' : 'auto';
    nearN = Number.isInteger(d.nearN) && d.nearN >= 1 ? d.nearN : 4;
    nearMethod = d.nearMethod === 'start' ? 'start' : 'chain';
    return { len };
  } catch (e) {
    return { len, err: e.message };
  }
}

// ---------- 座標 ----------
function parseNum(v) {
  if (typeof v === 'number') return v;
  const m = String(v ?? '').match(/[-+]?\d+(?:\.\d+)?/);
  return m ? Number(m[0]) : NaN;
}
// 經緯度判別：緯度必須在 ±90 內；若「緯度」欄超出而「經度」欄在範圍內，代表填反了
function normalizeLatLng(latRaw, lngRaw) {
  let lat = parseNum(latRaw), lng = parseNum(lngRaw);
  if (!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return { ok: false };
  let swapped = false;
  if (Math.abs(lat) > 90 && Math.abs(lng) <= 90) { [lat, lng] = [lng, lat]; swapped = true; }
  if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return { ok: false };
  return { ok: true, lat, lng, swapped };
}
function haversine(a, b) {
  const R = 6371008.8, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

// ---------- 匯入 ----------
async function readWorkbook(file) {
  const buf = await file.arrayBuffer();
  if (/\.csv$/i.test(file.name)) {
    // Excel 存出的 CSV 常是 Big5，UTF-8 解不開時改用 Big5
    let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { text = new TextDecoder('big5').decode(buf); }
    return XLSX.read(text.replace(/^﻿/, ''), { type: 'string', raw: true });
  }
  return XLSX.read(buf, { type: 'array' });
}

// 完成時間：格式 YYYY-MM-DD HH:mm，匯出與匯入共用
const pad2 = n => String(n).padStart(2, '0');
const fmtTime = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
// 匯入第 6 欄：只有「看起來像日期時間」才算已完成，其他內容（備註、狀態等）一律忽略
// 認得：Excel 日期（序號或日期格式）、2026-10-19、2026/10/19 14:32、2026-10-19T14:32:05
function parseDoneAt(v) {
  if (v instanceof Date && !isNaN(v)) return fmtTime(v);
  if (typeof v === 'number') {
    if (!(v > 36526 && v < 80000)) return '';  // 約 2000 年到 2118 年的 Excel 序號
    const d = new Date(Math.round((v - 25569) * 864e5));
    return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
  }
  const m = String(v ?? '').trim().match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T]+(\d{1,2}):(\d{2})(?::\d{2})?)?$/);
  if (!m) return '';
  const [, y, mo, da, h, mi] = m;
  if (+mo < 1 || +mo > 12 || +da < 1 || +da > 31 || (h !== undefined && (+h > 23 || +mi > 59))) return '';
  return `${y}-${pad2(mo)}-${pad2(da)}` + (h !== undefined ? ` ${pad2(h)}:${mi}` : '');
}

// 依欄位順序讀取：地點、代號、經度、緯度、地址、完成時間（不比對表頭文字）
const isNum = v => typeof v === 'number' || /^\s*[-+]?\d+(?:\.\d+)?\s*$/.test(String(v ?? ''));
function rowsToPoints(rows) {
  const blank = r => !r.some(c => String(c ?? '').trim() !== '');
  const data = rows.filter(r => !blank(r));
  const width = Math.max(0, ...data.map(r => r.length));
  if (width < 4) throw new Error('欄位不足，需依序為：地點、代號、經度、緯度（地址可省略）');
  // 第一列的第 3、4 欄都是數字就當資料，否則視為表頭跳過
  const body = data.length && isNum(data[0][2]) && isNum(data[0][3]) ? data : data.slice(1);
  let ignored = 0;  // 第 6 欄有內容但不是日期時間的列數
  const out = body.map((r, i) => {
    const get = k => String(r[k] ?? '').trim();
    const c = normalizeLatLng(r[3], r[2]);
    const doneAt = c.ok ? parseDoneAt(r[5]) : '';
    if (!doneAt && get(5) !== '') ignored++;
    return {
      id: 's' + i, name: get(0), code: get(1), addr: get(4),
      lat: c.ok ? c.lat : null, lng: c.ok ? c.lng : null,
      swapped: !!c.swapped, invalid: !c.ok, checked: false,
      done: !!doneAt, doneAt,
    };
  });
  out.ignoredCol6 = ignored;
  return out;
}

$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  const msg = $('importMsg');
  try {
    const wb = await readWorkbook(f);
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: true });
    const list = rowsToPoints(rows);
    if (!list.length) throw new Error('檔案裡沒有資料列');
    points = list;
    if (start && start.pointId) {
      // 起點不因匯入而清掉。原本綁定的地點編號已不適用，新資料裡座標相同的地點就重新綁定，否則當作一般座標
      const same = points.find(p => !p.invalid && p.lat === start.lat && p.lng === start.lng);
      if (same) start.pointId = same.id; else delete start.pointId;
    }
    clearRoute();
    const bad = list.filter(s => s.invalid).length, sw = list.filter(s => s.swapped).length;
    let t = `已匯入 ${list.length} 個地點`;
    if (sw) t += `，其中 ${sw} 筆經緯度填反，已自動對調`;
    if (bad) t += `；${bad} 筆座標空白或錯誤，無法勾選`;
    const dn = list.filter(s => s.done).length;
    if (dn) t += `；${dn} 個已標示完成`;
    if (list.ignoredCol6) t += `；${list.ignoredCol6} 筆第 6 欄不是日期時間，已忽略`;
    msg.className = 'notice ' + (bad || sw || list.ignoredCol6 ? 'warn' : 'ok');
    msg.textContent = t;
    save(); renderAll(); fitAll();
  } catch (err) {
    msg.className = 'notice err';
    msg.textContent = '匯入失敗：' + err.message;
  }
  e.target.value = '';
});

// ---------- 清單 ----------
function filtered() {
  const q = $('search').value.trim().toLowerCase();
  const base = hideDone ? points.filter(s => !s.done) : points;
  if (!q) return base;
  return base.filter(s => (s.name + ' ' + s.code + ' ' + s.addr).toLowerCase().includes(q));
}
function renderList() {
  $('list').innerHTML = filtered().map(s => `
    <div class="item${s.checked ? ' checked' : ''}${s.invalid ? ' invalid' : ''}${s.done ? ' done' : ''}${!s.done && !s.invalid ? ' todo' : ''}" data-id="${s.id}">
      <label class="pick">
        <input type="checkbox" class="sel" ${s.checked ? 'checked' : ''} ${s.invalid || s.done ? 'disabled' : ''}>
        <div class="body">
          <div class="name">${esc(s.name) || '(未命名)'}${s.swapped ? '<span class="tag warn">經緯度已對調</span>' : ''}${s.invalid ? '<span class="tag err">座標錯誤</span>' : ''}</div>
          <div class="meta">代號 ${esc(s.code) || '-'}${s.addr ? '｜' + esc(s.addr) : ''}</div>
          ${s.done ? `<div class="doneat">完成 ${esc(s.doneAt)}</div>` : ''}
        </div>
      </label>
      <label class="donebox${s.invalid ? ' off' : ''}"><input type="checkbox" class="dn" ${s.done ? 'checked' : ''} ${s.invalid ? 'disabled' : ''}>已完成</label>
    </div>`).join('');
  updateCount();
}
function updateCount() {
  const n = points.filter(s => s.checked).length, d = points.filter(s => s.done).length;
  $('count').textContent = `已勾選 ${n} 個｜已完成 ${d} / ${points.length}`;
  const b = $('clearDone');
  b.disabled = d === 0;
  if (!d) resetClearBtn();
}
function setChecked(ids, val) {
  if (selMode === 'auto') setSelMode('manual');  // 手動勾選就切成手動模式，避免被自動選取蓋掉
  const set = new Set(ids);
  points.forEach(s => { if (set.has(s.id) && !s.invalid && !s.done) s.checked = val; });
  clearRoute(); save(); renderList(); renderPointMarkers();
}
function setDone(id, val) {
  const s = points.find(x => x.id === id);
  if (!s || s.invalid) return;
  s.done = val;
  s.doneAt = val ? fmtTime(new Date()) : '';
  if (val) s.checked = false;
  clearRoute(); save(); renderList(); renderPointMarkers();
}
$('list').addEventListener('change', e => {
  const item = e.target.closest('.item');
  if (!item) return;
  if (e.target.classList.contains('dn')) setDone(item.dataset.id, e.target.checked);
  else setChecked([item.dataset.id], e.target.checked);
});
$('hideDone').addEventListener('change', e => { hideDone = e.target.checked; save(); renderList(); });

// 清除完成記錄：需再按一次確認（頁面內確認，不用對話框）
let clearTimer = null;
function resetClearBtn() {
  clearTimeout(clearTimer); clearTimer = null;
  const b = $('clearDone');
  b.textContent = '清除完成記錄';
  b.classList.remove('warnbtn');
}
$('clearDone').addEventListener('click', () => {
  const b = $('clearDone');
  if (!clearTimer) {
    b.textContent = '再按一次確認清除';
    b.classList.add('warnbtn');
    clearTimer = setTimeout(resetClearBtn, 4000);
    return;
  }
  resetClearBtn();
  points.forEach(s => { s.done = false; s.doneAt = ''; });
  clearRoute(); save(); renderList(); renderPointMarkers();
});
$('search').addEventListener('input', renderList);
$('selAll').addEventListener('click', () => setChecked(filtered().map(s => s.id), true));
$('selNone').addEventListener('click', () => setChecked(filtered().map(s => s.id), false));

// ---------- 起點 ----------
function setStart(s) {
  start = s; clearRoute(); save(); renderStart();
  autoPlan();
}
// 設好起點後直接規劃：自動模式有可選地點就跑；手動模式要已有勾選才跑
function autoPlan() {
  const usable = p => !p.invalid && !p.done && p.id !== start.pointId;
  const ok = selMode === 'auto' ? points.some(usable) : points.some(p => p.checked && usable(p));
  if (ok) plan();
}
function renderStart() {
  const el = $('startNow');
  if (!start) { el.innerHTML = '起點：<span style="color:var(--muted)">尚未設定</span>'; }
  else el.innerHTML = `起點：<b>${esc(start.label)}</b> <span style="color:var(--muted)">(${start.lat.toFixed(5)}, ${start.lng.toFixed(5)})</span>`;
  const sel = $('startPoint');
  sel.innerHTML = '<option value="">或選擇某個地點作為起點…</option>' +
    points.filter(s => !s.invalid).map(s => `<option value="${s.id}">${esc(s.name)}（${esc(s.code)}）</option>`).join('');
  sel.value = start && start.pointId ? start.pointId : '';
  if (start) $('startInput').value = `${start.lat.toFixed(6)}, ${start.lng.toFixed(6)}`;  // 重新整理後輸入框也帶回起點座標
  refreshOverlay();
}
$('startApply').addEventListener('click', () => {
  const parts = $('startInput').value.split(/[,，\s]+/).filter(Boolean);
  const c = parts.length >= 2 ? normalizeLatLng(parts[0], parts[1]) : { ok: false };
  if (!c.ok) { alertMsg('起點格式錯誤，請輸入「緯度, 經度」'); return; }
  map.setView([c.lat, c.lng], Math.max(map.getZoom(), 12));
  setStart({ lat: c.lat, lng: c.lng, label: '自訂座標' });  // 內含自動規劃，會再調整地圖範圍
});
$('startPoint').addEventListener('change', e => {
  const s = points.find(x => x.id === e.target.value);
  if (!s) return;
  setStart({ lat: s.lat, lng: s.lng, label: s.name + '（地點）', pointId: s.id });
});
$('startPick').addEventListener('click', () => setPicking(!picking));
function setPicking(on) {
  picking = on;
  document.querySelector('.a-map').classList.toggle('picking', on);
  $('startPick').classList.toggle('active', on);
  $('startPick').textContent = on ? '取消點選' : '在地圖點選';
  if (on && window.innerWidth < 900) document.querySelector('.a-map').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function alertMsg(t) { const m = $('planMsg'); m.className = 'notice err'; m.textContent = t; }

// ---------- 選取方式：自動（離起點最近 N 個）／手動 ----------
function setSelMode(m) {
  selMode = m;
  save(); renderSel();
}
function renderSel() {
  document.querySelectorAll('#selSeg button').forEach(b => b.classList.toggle('on', b.dataset.sel === selMode));
  $('nRow').hidden = selMode !== 'auto';
  $('methodSeg').hidden = selMode !== 'auto';
  document.querySelectorAll('#methodSeg button').forEach(b => b.classList.toggle('on', b.dataset.method === nearMethod));
  $('nearN').value = nearN;
}
$('methodSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.method === nearMethod) return;
  nearMethod = b.dataset.method; save(); renderSel();
});
const nearDesc = () => nearMethod === 'chain' ? '連鎖最近' : '離起點最近';
function readN() {
  const raw = $('nearN').value.trim();
  const n = Number(raw);
  return raw !== '' && Number.isInteger(n) && n >= 1 ? n : null;
}
$('selSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && b.dataset.sel !== selMode) setSelMode(b.dataset.sel);
});
$('nearN').addEventListener('input', () => {
  const n = readN();
  if (n) { nearN = n; save(); }
});
// 依直線距離挑出離起點最近的 N 個（不含已完成、座標錯誤、當作起點的那個地點），並更新勾選
// 回傳實際選到的個數，失敗回傳 0（已顯示錯誤訊息）
function applyNearest() {
  if (!start) { alertMsg('請先設定起始位置'); return 0; }
  const n = readN();
  if (!n) { alertMsg('N 請輸入 1 以上的整數'); return 0; }
  nearN = n;
  const pool = points.filter(s => !s.invalid && !s.done && s.id !== start.pointId);
  if (!pool.length) { alertMsg('沒有可選的地點（已完成與座標錯誤的不列入）'); return 0; }
  const chosen = [];
  if (nearMethod === 'start') {
    // 離起點最近的 N 個
    pool.map(s => ({ s, d: haversine(start, s) })).sort((a, b) => a.d - b.d).slice(0, n).forEach(x => chosen.push(x.s));
  } else {
    // 連鎖最近：從起點找最近的，再從剛選到的點找最近的，依序選滿 N 個
    let cur = start;
    while (chosen.length < n && pool.length) {
      let bi = 0, bd = Infinity;
      pool.forEach((s, i) => { const d = haversine(cur, s); if (d < bd) { bd = d; bi = i; } });
      cur = pool.splice(bi, 1)[0];
      chosen.push(cur);
    }
  }
  const picked = new Set(chosen.map(s => s.id));
  points.forEach(s => { s.checked = picked.has(s.id); });
  save(); renderList(); renderPointMarkers();
  return picked.size;
}
$('pickNearBtn').addEventListener('click', () => {
  clearRoute();
  const k = applyNearest();
  if (!k) return;
  const m = $('planMsg');
  m.className = 'notice ok';
  m.textContent = k < nearN ? `只有 ${k} 個可選，已全部選取` : `已用「${nearDesc()}」選取 ${k} 個`;
});

// ---------- 模式 ----------
function renderMode() {
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
}
$('modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.mode === mode) return;
  mode = b.dataset.mode; save(); renderMode();
  if (lastRoute) plan();
});

// ---------- 路徑演算法 ----------
// 節點 0 為起點，1..m 為地點。回傳拜訪順序（不含起點）
function heldKarp(D, n, round) {
  const m = n - 1, full = 1 << m;
  const dp = new Float64Array(full * m).fill(Infinity);
  const par = new Int8Array(full * m).fill(-1);
  for (let j = 0; j < m; j++) dp[(1 << j) * m + j] = D[j + 1];
  for (let mask = 1; mask < full; mask++) {
    for (let j = 0; j < m; j++) {
      const cur = dp[mask * m + j];
      if (!(mask & (1 << j)) || cur === Infinity) continue;
      for (let k = 0; k < m; k++) {
        if (mask & (1 << k)) continue;
        const nm = mask | (1 << k), v = cur + D[(j + 1) * n + k + 1];
        if (v < dp[nm * m + k]) { dp[nm * m + k] = v; par[nm * m + k] = j; }
      }
    }
  }
  let best = Infinity, last = 0;
  for (let j = 0; j < m; j++) {
    const v = dp[(full - 1) * m + j] + (round ? D[(j + 1) * n] : 0);
    if (v < best) { best = v; last = j; }
  }
  const order = [];
  let mask = full - 1, j = last;
  while (j >= 0) { order.push(j + 1); const p = par[mask * m + j]; mask ^= 1 << j; j = p; }
  return order.reverse();
}

function heuristic(D, n, round) {
  // 最近鄰居法建立初始路徑
  const used = new Uint8Array(n); used[0] = 1;
  const t = [0];
  for (let s = 1; s < n; s++) {
    const a = t[t.length - 1];
    let best = -1, bd = Infinity;
    for (let k = 1; k < n; k++) if (!used[k] && D[a * n + k] < bd) { bd = D[a * n + k]; best = k; }
    used[best] = 1; t.push(best);
  }
  const d = (x, y) => D[x * n + y];
  let improved = true, guard = 0;
  while (improved && guard++ < 1000) {
    improved = twoOpt() | orOpt();
  }
  return t.slice(1);

  // 2-opt：反轉 t[i..j]，起點 t[0] 固定
  function twoOpt() {
    let improved = false;
    for (let i = 1; i < n - 1; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = t[i - 1], b = t[i], c = t[j];
        const hasNext = j < n - 1 || round;
        const e = j < n - 1 ? t[j + 1] : t[0];
        const delta = d(a, c) - d(a, b) + (hasNext ? d(b, e) - d(c, e) : 0);
        if (delta < -1e-6) {
          for (let x = i, y = j; x < y; x++, y--) [t[x], t[y]] = [t[y], t[x]];
          improved = true;
        }
      }
    }
    return improved;
  }

  // Or-opt：把連續 1~3 個點整段搬到別處（可反向插入）
  function orOpt() {
    let improved = false;
    for (let L = 1; L <= 3; L++) {
      for (let i = 1; i + L <= n; i++) {
        const prev = t[i - 1], first = t[i], last = t[i + L - 1];
        const next = i + L < n ? t[i + L] : (round ? t[0] : -1);
        const gain = d(prev, first) + (next >= 0 ? d(last, next) - d(prev, next) : 0);
        let best = -1e-6, bp = -1, brev = false;
        for (let p = 0; p < n; p++) {
          if (p >= i - 1 && p <= i + L - 1) continue;
          const a = t[p], b = p + 1 < n ? t[p + 1] : (round ? t[0] : -1);
          const base = b >= 0 ? d(a, b) : 0;
          const fwd = d(a, first) + (b >= 0 ? d(last, b) : 0) - base - gain;
          const rev = d(a, last) + (b >= 0 ? d(first, b) : 0) - base - gain;
          if (fwd < best) { best = fwd; bp = p; brev = false; }
          if (rev < best) { best = rev; bp = p; brev = true; }
        }
        if (bp >= 0) {
          const seg = t.splice(i, L);
          if (brev) seg.reverse();
          t.splice(bp < i ? bp + 1 : bp + 1 - L, 0, ...seg);
          improved = true;
        }
      }
    }
    return improved;
  }
}

function plan() {
  if (!start) { alertMsg('請先設定起始位置'); return; }
  const auto = selMode === 'auto';
  if (auto && !applyNearest()) return;
  const sel = points.filter(s => s.checked && !s.invalid && !s.done && s.id !== start.pointId);
  if (!sel.length) { alertMsg('請至少勾選一個地點（起點與已完成的不列入）'); return; }

  const pts = [start, ...sel], n = pts.length;
  const D = new Float64Array(n * n);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) D[i * n + j] = D[j * n + i] = haversine(pts[i], pts[j]);

  const round = mode === 'round';
  const exact = sel.length <= EXACT_LIMIT;
  const order = exact ? heldKarp(D, n, round) : heuristic(D, n, round);

  const legs = [];
  let prev = 0, total = 0;
  for (const k of order) { const dist = D[prev * n + k]; total += dist; legs.push({ p: pts[k], dist, cum: total }); prev = k; }
  let back = null;
  if (round) { back = D[prev * n]; total += back; }

  lastRoute = { legs, back, total, exact, round };
  const m = $('planMsg');
  m.className = 'notice ok';
  const pre = auto ? (sel.length < nearN ? `只有 ${sel.length} 個可選，已全部納入；` : `已用「${nearDesc()}」選取 ${sel.length} 個；`) : '';
  m.textContent = pre + (exact ? `已算出最短路徑（精確解，共 ${sel.length} 個地點）` : `已規劃路徑（${sel.length} 個地點，近似最佳解）`);
  renderResult(); renderRoute();
  if (window.innerWidth < 900) document.querySelector('.a-map').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('planBtn').addEventListener('click', plan);

function clearRoute() {
  lastRoute = null;
  $('result').hidden = true;
  $('planMsg').textContent = '';
  if (routeLayer) routeLayer.clearLayers();
  if (routeMarkerLayer) routeMarkerLayer.clearLayers();
  if (start) renderStartMarker([]);
  if (pointLayer && map && !map.hasLayer(pointLayer)) pointLayer.addTo(map);
}

// ---------- 結果 ----------
function renderResult() {
  const r = lastRoute;
  $('result').hidden = false;
  $('summary').innerHTML = `
    <div><b>${fmtKm(r.total)}</b><span>總距離 (km)</span></div>
    <div><b>${r.legs.length}</b><span>點數</span></div>
    <div><b>${r.round ? '環狀' : '單程'}</b><span>${r.exact ? '精確解' : '近似解'}</span></div>`;

  let html = `<li><span class="no s">起</span><div class="body"><div class="name"><b>${esc(start.label)}</b></div>
    <div class="meta" style="color:var(--muted);font-size:12.5px">${start.lat.toFixed(5)}, ${start.lng.toFixed(5)}</div></div></li>`;
  r.legs.forEach((l, i) => {
    html += `<li><span class="no">${i + 1}</span><div class="body"><div><b>${esc(l.p.name)}</b></div>
      <div style="color:var(--muted);font-size:12.5px;word-break:break-all">代號 ${esc(l.p.code) || '-'}${l.p.addr ? '｜' + esc(l.p.addr) : ''}</div></div>
      <div class="dist"><b>+${fmtKm(l.dist)}</b> km<br>累計 ${fmtKm(l.cum)}</div></li>`;
  });
  if (r.round) html += `<li><span class="no s">終</span><div class="body"><b>回到起點</b></div>
    <div class="dist"><b>+${fmtKm(r.back)}</b> km<br>累計 ${fmtKm(r.total)}</div></li>`;
  $('route').innerHTML = html;

  // Google Maps 分段導航連結
  const seq = [start, ...r.legs.map(l => l.p)];
  if (r.round) seq.push(start);
  const ll = p => `${p.lat},${p.lng}`;
  const links = [];
  for (let i = 0; i < seq.length - 1; i += GMAPS_POINTS - 1) {
    const chunk = seq.slice(i, i + GMAPS_POINTS);
    const url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving'
      + '&origin=' + ll(chunk[0]) + '&destination=' + ll(chunk[chunk.length - 1])
      + (chunk.length > 2 ? '&waypoints=' + encodeURIComponent(chunk.slice(1, -1).map(ll).join('|')) : '');
    const label = j => (i + j === 0 ? '起點' : (r.round && i + j === seq.length - 1) ? '終點' : '第' + (i + j) + '點');
    links.push(`<a class="btn" href="${url}" target="_blank" rel="noopener">Google Maps 導航${seq.length > GMAPS_POINTS ? `（${label(0)} → ${label(chunk.length - 1)}）` : ''}</a>`);
  }
  $('links').innerHTML = links.join('');
}

const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
// DELIVER_START
function deliver(text, name, btn, label) {
  const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// DELIVER_END
$('exportBtn').addEventListener('click', () => {
  const r = lastRoute;
  if (!r) return;
  const lines = [['順序', '地點', '代號', '經度', '緯度', '地址', '區間距離(km)', '累計距離(km)'].map(q).join(',')];
  lines.push(['起點', start.label, '', start.lng, start.lat, '', '', ''].map(q).join(','));
  r.legs.forEach((l, i) => lines.push([i + 1, l.p.name, l.p.code, l.p.lng, l.p.lat, l.p.addr, fmtKm(l.dist), fmtKm(l.cum)].map(q).join(',')));
  if (r.round) lines.push(['終點', '回到起點', '', start.lng, start.lat, '', fmtKm(r.back), fmtKm(r.total)].map(q).join(','));
  deliver(lines.join('\r\n'), '路線.csv', $('exportBtn'), '匯出 CSV');
});

// 匯出全部地點（含完成時間），欄位順序與匯入相同，可直接再匯入還原完成狀態
$('exportList').addEventListener('click', () => {
  if (!points.length) return;
  const lines = [['地點', '代號', '經度', '緯度', '地址', '完成時間'].map(q).join(',')];
  points.forEach(s => lines.push([s.name, s.code, s.invalid ? '' : s.lng, s.invalid ? '' : s.lat, s.addr, s.done ? s.doneAt : ''].map(q).join(',')));
  deliver(lines.join('\r\n'), '地點清單.csv', $('exportList'), '匯出清單');
});

// ---------- 地圖 ----------
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const map = L.map('map', { preferCanvas: true, zoomControl: true }).setView([23.7, 120.95], 7);
const baseMaps = {
  '台灣電子地圖': L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
    maxZoom: 19, attribution: '&copy; 國土測繪中心' }),
  '街道圖 (CARTO)': L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO' }),
};
const baseNames = Object.keys(baseMaps);
let curBase = baseMaps[baseNames[0]].addTo(map), tileErrs = 0;
// 圖磚連續載入失敗（被擋或網路問題）時，自動切到下一個底圖
function watchTiles(layer) {
  layer.on('tileerror', () => {
    if (layer !== curBase || ++tileErrs < 4) return;
    const next = baseNames.map(n => baseMaps[n]).find(l => l !== layer && !l._failed);
    layer._failed = true;
    if (next) { map.removeLayer(layer); curBase = next.addTo(map); tileErrs = 0; }
  });
  layer.on('tileload', () => { if (layer === curBase) tileErrs = 0; });
}
Object.values(baseMaps).forEach(watchTiles);
L.control.layers(baseMaps, null, { position: 'topleft' }).addTo(map);
map.on('baselayerchange', e => { curBase = e.layer; tileErrs = 0; });
const pointLayer = L.layerGroup().addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const routeMarkerLayer = L.layerGroup().addTo(map);
map.on('zoomend', () => { if (lastRoute && start) drawRouteMarkers(); });
let startMarker = null;

function renderPointMarkers() {
  pointLayer.clearLayers();
  const todo = css('--todo'), dn = css('--done');
  points.forEach(s => {
    if (s.invalid) return;
    // 未完成紅色、已完成綠色；納入規劃的點比較大、外框加粗
    L.circleMarker([s.lat, s.lng], {
      radius: s.checked ? 8 : 5, color: '#fff', weight: s.checked ? 3 : 1.5,
      fillColor: s.done ? dn : todo, fillOpacity: 0.95,
    }).bindTooltip(`${esc(s.name)}（${esc(s.code)}）`)
      .on('click', () => onPointClick(s))
      .addTo(pointLayer);
  });
}
// 起點標記與路線編號：距離很近的標記合併成一顆（例如「7·8」），避免被蓋住；縮放後會重新計算
const MERGE_PX = 20;
const numText = nums => nums.length <= 3 ? nums.join('·') : `${nums[0]}等${nums.length}`;
// items: 與起點重疊的路線點 [{n, p}]，有的話起點標記顯示「起·1·2」，點一下可看到這些點
function renderStartMarker(items) {
  if (startMarker) { startMarker.remove(); startMarker = null; }
  if (!start) return;
  const near = items || [];
  startMarker = L.marker([start.lat, start.lng], {
    icon: L.divIcon({ className: 'start-icon', html: `<span>${near.length ? '起·' + numText(near.map(x => x.n)) : '起'}</span>`, iconSize: [0, 0], iconAnchor: [0, 0] }),
    zIndexOffset: 1000,
  }).bindTooltip('起點：' + esc(start.label)).addTo(map);
  if (near.length) startMarker.on('click', () => { if (!picking) openPointsPopup(near.map(x => x.p), start.lat, start.lng, near.map(x => x.n)); });
}
// 有路線時畫路線編號並處理起點標記，沒有路線時只畫起點
function refreshOverlay() {
  if (lastRoute && start) drawRouteMarkers(); else renderStartMarker([]);
}
function drawRouteMarkers() {
  routeMarkerLayer.clearLayers();
  const r = lastRoute;
  const pt = p => map.latLngToLayerPoint([p.lat, p.lng]);
  const sp = pt(start);
  const groups = [], nearStart = [];
  r.legs.forEach((l, i) => {
    const item = { n: i + 1, p: l.p };
    const lp = pt(l.p);
    if (lp.distanceTo(sp) < MERGE_PX) { nearStart.push(item); return; }
    const g = groups.find(x => x.pos.distanceTo(lp) < MERGE_PX);
    if (g) g.items.push(item); else groups.push({ pos: lp, p: l.p, items: [item] });
  });
  groups.forEach(g => {
    const nums = g.items.map(x => x.n);
    L.marker([g.p.lat, g.p.lng], {
      icon: L.divIcon({ className: 'num-icon', html: `<span>${numText(nums)}</span>`, iconSize: [0, 0], iconAnchor: [0, 0] }),
    }).bindTooltip(g.items.map(x => `${x.n}. ${esc(x.p.name)}（${esc(x.p.code)}）`).join('<br>'))
      .on('click', () => { if (!picking) openPointsPopup(g.items.map(x => x.p), g.p.lat, g.p.lng, nums); })
      .addTo(routeMarkerLayer);
  });
  renderStartMarker(nearStart);
}
function renderRoute() {
  routeLayer.clearLayers();
  const r = lastRoute;
  const path = [[start.lat, start.lng], ...r.legs.map(l => [l.p.lat, l.p.lng])];
  if (r.round) path.push([start.lat, start.lng]);
  L.polyline(path, { color: css('--accent'), weight: 4, opacity: 0.85 }).addTo(routeLayer);
  drawRouteMarkers();
  map.fitBounds(L.latLngBounds(path), { padding: [30, 30] });
}

// ---------- 點地圖上的地點：開小視窗（標示完成／納入）並讓清單跳到該筆 ----------
function notify(text, kind) { const m = $('planMsg'); m.className = 'notice ' + (kind || 'ok'); m.textContent = text; }
// 讓清單捲到該筆並短暫高亮；清單裡看不到（被隱藏）回傳 false
function revealInList(id) {
  const q = $('search');
  if (q.value.trim() && !filtered().some(s => s.id === id)) { q.value = ''; renderList(); }
  const row = [...$('list').children].find(el => el.dataset && el.dataset.id === id);
  if (!row) return false;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  return true;
}
// 點到的位置若有好幾個地點疊在一起（同地址），小視窗會全部列出，各自可標示完成
function onPointClick(s) {
  if (picking) return;
  const sp = map.latLngToLayerPoint([s.lat, s.lng]);
  const list = points.filter(p => !p.invalid && map.latLngToLayerPoint([p.lat, p.lng]).distanceTo(sp) < 12);
  openPointsPopup(list.length ? list : [s], s.lat, s.lng);
}
function openPointsPopup(list, lat, lng, nums) {
  const wrap = document.createElement('div');
  wrap.className = 'pop-list';
  list.forEach((s, i) => wrap.appendChild(buildPointBox(s, nums ? `${nums[i]}. ` : '')));
  L.popup({ maxWidth: 260 }).setLatLng([lat, lng]).setContent(wrap).openOn(map);
}
function buildPointBox(s, prefix) {
  const box = document.createElement('div');
  box.className = 'pop';
  box.innerHTML = `<div class="pn">${prefix}${esc(s.name) || '(未命名)'}</div>
    <div class="pm">代號 ${esc(s.code) || '-'}${s.addr ? '｜' + esc(s.addr) : ''}</div>
    ${s.done ? `<div class="doneat">完成 ${esc(s.doneAt)}</div>` : ''}<div class="pb"></div>`;
  const pb = box.querySelector('.pb');
  const add = (label, cls, fn) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls;
    b.addEventListener('click', fn); pb.appendChild(b);
  };
  add(s.done ? '取消完成' : '設為已完成', s.done ? '' : 'primary', () => {
    map.closePopup();
    const becoming = !s.done;
    setDone(s.id, becoming);
    if (becoming && hideDone) notify(`${s.name || '該地點'} 已標示完成（清單已隱藏已完成的項目）`);
  });
  if (!s.done) add(s.checked ? '取消納入' : '納入規劃', '', () => { map.closePopup(); setChecked([s.id], !s.checked); });
  add('在清單中查看', '', () => {
    map.closePopup();
    if (!revealInList(s.id)) notify('這一筆在清單中已隱藏（已完成）', 'warn');
  });
  return box;
}
function fitAll() {
  const pts = points.filter(s => !s.invalid).map(s => [s.lat, s.lng]);
  if (start) pts.push([start.lat, start.lng]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 15 });
}
$('fitBtn').addEventListener('click', fitAll);
map.on('click', e => {
  if (!picking) return;
  setPicking(false);
  setStart({ lat: e.latlng.lat, lng: e.latlng.lng, label: '地圖點選位置' });
});
window.addEventListener('resize', () => map.invalidateSize());
// 路線順序出現或隱藏時，地圖高度會跟著變，要通知地圖重新計算
if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe($('map'));
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { renderPointMarkers(); if (lastRoute) renderRoute(); });

// ---------- 初始化 ----------
function renderAll() { $('hideDone').checked = hideDone; renderSel(); renderList();renderStart(); renderMode(); renderPointMarkers(); }
const loaded = load();
const initMsg = $('importMsg');
try {
  renderAll();
  if (points.length) fitAll();
  if (loaded.err) { initMsg.className = 'notice err'; initMsg.textContent = `還原失敗（儲存區有 ${loaded.len} 字元）：${loaded.err}`; }
  else if (loaded.len) {
    initMsg.className = 'notice ok';
    initMsg.textContent = `已還原上次的資料：${points.length} 個地點${start ? '、起點「' + start.label + '」' : ''}（儲存區 ${loaded.len} 字元）`;
  }
} catch (e) {
  initMsg.className = 'notice err';
  initMsg.textContent = `顯示失敗（儲存區有 ${loaded.len} 字元，已讀到 ${points.length} 個地點）：${e.message}`;
  console.error(e);
}
})();
